# Render blueprint for PermitFrame. Apply via "New from Blueprint" and fill
# the secret values in the dashboard — nothing secret lives in this file.
services:
  - type: web
    name: permitframe
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # always-on; free sleeps and would kill DKG polling
    healthCheckPath: /api/healthz # public process liveness; /api/health remains signed-in integration status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DKG_MODE
        value: edge
      - key: DKG_ENDPOINT_LABEL
        value: EC2 edge node via SSH
      - key: DKG_SSH_HOST
        value: 3.77.202.228
      - key: DKG_SSH_USER
        value: harsh
      # Key *content* (Render secret). Local dev uses DKG_SSH_KEY (file path) instead.
      - key: DKG_SSH_KEY_INLINE
        sync: false
      - key: DKG_REMOTE_DKG_BIN
        value: /home/harsh/.local/bin/dkg
      - key: DKG_CONTEXT_GRAPH
        value: permitframe-acceptance-20260919
      - key: DKG_CONTEXT_GRAPH_ID
        value: 0x31c83Ac625c29Ef7F4fabDB49ee68Fb56B06977c/permitframe-acceptance-20260919
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      # Durable deliverable storage. Without these, generation still works
      # but outputs stay provider-hosted and approval/publish proof steps
      # wait as storage-pending - set all three for public verification.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: keyed Livepeer path. Unset keeps the hosted default endpoint.
      - key: LIVEPEER_MCP_BEARER
        sync: false
